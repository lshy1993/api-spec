openapi: 3.0.0
info:
  title: Genshin Quiz API
  description: API for Genshin Impact Quiz Application
  version: 1.0.0
  contact:
    name: API Support
    email: support@genshinquiz.com

servers:
  - url: http://localhost:8080
    description: Development server
  - url: https://api.moelink.com
    description: Production server

paths:
  /auth/register:
    post:
      summary: Register a new user
      operationId: postRegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                language:
                  type: string
                  description: Preferred language code (e.g., "en", "zh")
              required:
                - email
                - password
      responses:
        "201":
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/login:
    post:
      summary: Login user
      operationId: postLoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
              required:
                - email
                - password
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/forgot-password:
    post:
      summary: Request password reset
      operationId: postForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Password reset email sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/reset-password:
    post:
      summary: Reset password
      operationId: postResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                  format: password
              required:
                - token
                - password
      responses:
        "200":
          description: Password reset
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/change-password:
    post:
      summary: Change password
      operationId: postChangePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
              required:
                - old_password
                - new_password
      responses:
        "200":
          description: Password changed successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/verify-email:
    post:
      summary: Verify email address
      operationId: postVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
              required:
                - token
      responses:
        "200":
          description: Email verified successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/send-verification-email:
    post:
      summary: Send verification email
      description: Sends a email with a verification token link to the user.
      operationId: postSendVerificationEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
              required:
                - email
      responses:
        "200":
          description: Verification email sent successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth/me:
    get:
      summary: 获取当前用户信息
      operationId: getCurrentUser
      responses:
        "200":
          description: 成功获取当前用户信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPrivate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update current user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPrivate"
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPrivate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete current user
      operationId: deleteUser
      responses:
        "204":
          description: User deleted successfully
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /home:
    get:
      summary: Get homepage data
      operationId: getHome
      parameters:
        - name: language
          in: query
          schema:
            type: string
            example: zh
      responses:
        "200":
          description: Homepage data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePageData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      summary: Get all users
      operationId: getUsers
      parameters:
        - name: ids
          in: query
          schema:
            type: array
            items:
              type: string
              format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sortBy
          in: query
          description: >
            排行榜排序依据。accuracy 按 Wilson 95% 置信区间下界排序（兼顾正确率与答题量，
            公式见 User.total_answers/correct_answers 说明，total_answers=0 的用户排除在外）；
            votes/questions_created/likes_received 均按对应字段数值直接排序。
          schema:
            type: string
            enum: [accuracy, votes, questions_created, likes_received]
        - name: sortDesc
          in: query
          schema:
            type: boolean
            default: true
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserPublic"
                  total:
                    type: integer
                required:
                  - users
                  - total
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{id}:
    get:
      summary: Get user by ID
      operationId: getUser
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPublic"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions:
    get:
      summary: Get all questions
      operationId: getQuestions
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 100
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/Category"
        - name: difficulty
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Difficulty"
        - name: query
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: array
            items:
              type: string
        - name: created_by
          in: query
          description: 只返回指定用户创建的题目
          schema:
            type: string
            format: uuid
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDesc
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of questions
          content:
            application/json:
              schema:
                type: object
                properties:
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Question"
                  total:
                    type: integer
                required:
                  - questions
                  - total
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create a new question
      operationId: postCreateQuestion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "201":
          description: Question created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQuestionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions/{id}:
    get:
      summary: Get question by ID
      operationId: getQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Question details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update question
      operationId: updateQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionRequest"
      responses:
        "200":
          description: Question updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQuestionRequest"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete question
      operationId: deleteQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Question deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions/{id}/submit:
    post:
      summary: Submit answer for a question
      description: Submit user's answer for a specific question and get result
      operationId: postSubmitAnswer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Question ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                selected_option_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                time_spent:
                  type: integer
                exam_id:
                  type: string
                  format: uuid
              required:
                - selected_option_ids
                - time_spent
      responses:
        "200":
          description: Answer submission result
          content:
            application/json:
              schema:
                type: object
                properties:
                  correct:
                    type: boolean
                required:
                  - correct
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions/{id}/like:
    post:
      summary: Like or dislike a question
      description: Submit user's answer for a specific question and get result
      operationId: postLikeQuestion
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Question ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                like:
                  type: integer
                  enum: [1, 0, -1]
                  description: "点赞状态：1=点赞，0=取消操作，-1=点踩"
              required:
                - like
      responses:
        "201":
          description: Like/dislike submitted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions/{id}/my-answers:
    get:
      summary: Get my submissions for a question
      description: Get current user's submission records for a specific question (up to 100 records)
      operationId: getQuestionMySubmissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Question ID
      responses:
        "200":
          description: List of question submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /questions/{id}/recent:
    get:
      summary: Get recent submissions from other users
      description: Get recent submission records from other users for a specific question (up to 100 records)
      operationId: getQuestionRecentSubmissions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Question ID
      responses:
        "200":
          description: List of question submissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RecentSubmission"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /exams:
    get:
      summary: Get all exams
      operationId: getExams
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: category
          in: query
          schema:
            $ref: "#/components/schemas/Category"
        - name: difficulty
          in: query
          schema:
            $ref: "#/components/schemas/Difficulty"
        - name: query
          in: query
          schema:
            type: string
        - name: created_by
          in: query
          description: 只返回指定用户创建的测验
          schema:
            type: string
            format: uuid
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDesc
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: List of exams
          content:
            application/json:
              schema:
                type: object
                properties:
                  exams:
                    type: array
                    items:
                      $ref: "#/components/schemas/Exam"
                  total:
                    type: integer
                required:
                  - exams
                  - total
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      summary: Create a new exam
      operationId: postCreateExam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Exam"
      responses:
        "201":
          description: Exam created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /exams/{id}:
    get:
      summary: Get exam by ID
      operationId: getExam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Exam details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      summary: Update exam
      operationId: updateExam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Exam"
      responses:
        "200":
          description: Exam updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete exam
      operationId: deleteExam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Exam deleted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /exams/{id}/like:
    post:
      summary: 点赞测验
      operationId: postLikeExam
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Exam ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                like:
                  type: integer
                  enum: [1, 0, -1]
                  description: "点赞状态：1=点赞，0=取消操作，-1=点踩"
              required:
                - like
      responses:
        "201":
          description: Like/dislike submitted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /polls:
    get:
      summary: Get all polls
      operationId: getPolls
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: type
          in: query
          schema:
            type: string
            enum: ["all", "available", "expired"]
        - name: query
          in: query
          schema:
            type: string
        - name: language
          in: query
          schema:
            type: array
            items:
              type: string
        - name: created_by
          in: query
          description: 只返回指定用户创建的投票
          schema:
            type: string
            format: uuid
        - name: sortBy
          in: query
          schema:
            type: string
        - name: sortDesc
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: 投票列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  polls:
                    type: array
                    items:
                      $ref: "#/components/schemas/Poll"
                  total:
                    type: integer
                required:
                  - polls
                  - total
        "500":
          $ref: "#/components/responses/InternalServerError"

    post:
      summary: Create new poll
      operationId: postCreatePoll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePollRequest"
      responses:
        "201":
          description: 投票创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /polls/{id}:
    get:
      summary: 获取投票详情（含当前结果）
      operationId: getVote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 投票详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Poll"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /polls/{id}/like:
    post:
      summary: 点赞投票
      operationId: postLikePoll
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Question ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                like:
                  type: integer
                  enum: [1, 0, -1]
                  description: "点赞状态：1=点赞，0=取消操作，-1=点踩"
              required:
                - like
      responses:
        "201":
          description: Like/dislike submitted successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /polls/{id}/vote:
    post:
      summary: 投票
      operationId: postVote
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                options:
                  type: array
                  description: "投票选项列表，每个选项可以投不同数量的票"
                  items:
                    $ref: "#/components/schemas/PollVote"
                anonymous:
                  type: boolean
                  description: "是否匿名投票"
              required:
                - options
      responses:
        "200":
          description: 投票成功
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    HomePageData:
      type: object
      properties:
        popularExams:
          type: array
          items:
            $ref: "#/components/schemas/Exam"
        latestQuestions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        latestPolls:
          type: array
          items:
            $ref: "#/components/schemas/Poll"
        popularPolls:
          type: array
          items:
            $ref: "#/components/schemas/Poll"
      required:
        - popularExams
        - latestQuestions
        - latestPolls
        - popularPolls

    Visibility:
      type: string
      enum:
        - public
        - private

    UserBase:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "b3b6c1e2-7e2a-4c1a-9e2a-1c2b3d4e5f6a"
        nickname:
          type: string
          example: "Traveler"
        avatar_url:
          type: string
          format: uri
          example: "https://example.com/avatar.jpg"
        bio:
          type: string
          example: "A passionate Genshin Impact player."
        registered_at:
          type: string
          format: date-time

    UserProfile:
      type: object
      properties:
        email:
          type: string
          format: email
        gender:
          type: string
          enum: [unknown, male, female, other]
        country:
          type: string
          example: "CN"
        language:
          type: string
          example: "zh"
        birthday:
          type: string
          format: date
          example: "2010-10-10"

    UserPrivacy:
      type: object
      properties:
        email_visibility:
          $ref: "#/components/schemas/Visibility"
        birthday_visibility:
          $ref: "#/components/schemas/Visibility"
        gender_visibility:
          $ref: "#/components/schemas/Visibility"
        country_visibility:
          $ref: "#/components/schemas/Visibility"

    UserStats:
      type: object
      properties:
        total_answers:
          type: integer
        correct_answers:
          type: integer
        questions_created:
          type: integer
        polls_created:
          type: integer
        likes_received:
          type: integer

    UserPublic:
      allOf:
        - $ref: "#/components/schemas/UserBase"
        - $ref: "#/components/schemas/UserProfile"
        - $ref: "#/components/schemas/UserStats"

    UserSecurity:
      type: object
      properties:
        email_verified:
          type: boolean
        registered_ip:
          oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
          example: "2001:0db8:85a3:0000:0000:8a2e:0370:7334"
        last_login_at:
          type: string
          format: date-time
        last_login_ip:
          oneOf:
            - type: string
              format: ipv4
            - type: string
              format: ipv6
          example: "192.168.1.2"

    UserPrivate:
      allOf:
        - $ref: "#/components/schemas/UserPublic"
        - $ref: "#/components/schemas/UserPrivacy"
        - $ref: "#/components/schemas/UserSecurity"

    UserAdmin:
      allOf:
        - $ref: "#/components/schemas/UserPrivate"
        - type: object
          properties:
            is_deleted:
              type: boolean

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        user:
          $ref: "#/components/schemas/UserPrivate"
      required:
        - token
        - user

    LocalizedText:
      type: object
      description: |
        Localized text keyed by language code.
        Example: {"en-US": "Hello", "ja-JP": "こんにちは", "zh-CN": "你好"}
      additionalProperties:
        type: string

    LikeStatus:
      type: integer
      enum: [-1, 0, -1]
      description: "点赞状态：-1踩, 0未操作, 1赞"

    ExamBase:
      type: object
      properties:
        public:
          type: boolean
        title:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
          example: "medium"
        time_limit:
          type: integer
          description: "Time limit in seconds"
      required:
        - public
        - title
        - categories
        - difficulty
        - time_limit

    ExamQuestion:
      type: object
      properties:
        question_id:
          type: string
          format: uuid
        order_index:
          type: number
        points:
          type: number

    Exam:
      allOf:
        - $ref: "#/components/schemas/ExamBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            created_by:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            likes_count:
              type: integer
              description: "点赞数"
            like_status:
              $ref: "#/components/schemas/LikeStatus"
            questions:
              type: array
              items:
                $ref: "#/components/schemas/ExamQuestion"
          required:
            - id
            - create_at
            - create_by
            - updated_at
            - likes_count
            - like_status
            - questions

    CreateExamRequest:
      allOf:
        - $ref: "#/components/schemas/ExamBase"
        - type: object
          properties:
            questions:
              type: array
              items:
                $ref: "#/components/schemas/ExamQuestion"
          required:
            - questions

    QuestionBase:
      type: object
      properties:
        public:
          type: boolean
          description: "是否公开可见"
        question_type:
          $ref: "#/components/schemas/QuestionType"
        category:
          $ref: "#/components/schemas/Category"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        question_text:
          $ref: "#/components/schemas/LocalizedText"
          example: "Which character is the Anemo Archon?"
        explanation:
          $ref: "#/components/schemas/LocalizedText"
          example: "Venti is the Anemo Archon, also known as Barbatos"

    Question:
      allOf:
        - $ref: "#/components/schemas/QuestionBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            options:
              type: array
              items:
                $ref: "#/components/schemas/QuestionOption"
            solved:
              type: boolean
              description: "是否已经通过了"
            like_status:
              $ref: "#/components/schemas/LikeStatus"
            answers_count:
              type: integer
              description: 总答题人数
            correct_answers_count:
              type: integer
              description: 总答对人数
            likes_count:
              type: integer
              description: 点赞数
            created_by:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
          required:
            - id
            - options
            - solved
            - like_status
            - answer_count
            - correct_count
            - likes_count
            - created_by
            - created_at

    CreateQuestionRequest:
      allOf:
        - $ref: "#/components/schemas/QuestionBase"
        - type: object
          properties:
            options:
              type: array
              items:
                $ref: "#/components/schemas/CreateQuestionOptionRequest"
          required:
            - options

    QuestionOptionBase:
      type: object
      properties:
        option_type:
          $ref: "#/components/schemas/OptionType"
        text:
          $ref: "#/components/schemas/LocalizedText"
        media_url:
          type: string
          format: uri
      required:
        - option_type

    QuestionOption:
      allOf:
        - $ref: "#/components/schemas/QuestionOptionBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            selected_count:
              type: integer
              description: 选中次数
          required:
            - id
            - count

    CreateQuestionOptionRequest:
      allOf:
        - $ref: "#/components/schemas/QuestionOptionBase"
        - type: object
          properties:
            is_answer:
              type: boolean
              description: 是否为正确答案
          required:
            - is_answer

    QuestionType:
      type: string
      description: 题目类型
      enum:
        - single_choice
        - multiple_choice
        - true_false
      example: single_choice

    Category:
      type: string
      description: 分类
      enum:
        - character
        - weapon
        - artifact
        - lore
        - gameplay
        - world
        - combat
        - music
        - statistics
        - fun
        - other
      example: character

    Difficulty:
      type: string
      description: 难度等级
      enum:
        - easy
        - medium
        - hard
      example: medium

    QuestionSubmission:
      allOf:
        - $ref: "#/components/schemas/SubmissionBase"
        - type: object
          properties:
            selected_option_ids:
              type: array
              items:
                type: string
                format: uuid
          required:
            - selected_option_ids

    RecentSubmission:
      allOf:
        - $ref: "#/components/schemas/SubmissionBase"
        - type: object
          properties:
            user:
              $ref: "#/components/schemas/UserPublic"
          required:
            - user

    SubmissionBase:
      type: object
      properties:
        is_correct:
          type: boolean
          description: 答案是否正确
          example: true
        time_spent:
          type: integer
          description: 答题用时（秒）
          example: 30
        submitted_at:
          type: string
          format: date-time
          description: 提交时间
          example: "2023-10-01T12:00:00Z"
      required:
        - is_correct
        - time_spent
        - submitted_at

    PollBase:
      type: object
      properties:
        public:
          type: boolean
        title:
          $ref: "#/components/schemas/LocalizedText"
        description:
          $ref: "#/components/schemas/LocalizedText"
        category:
          $ref: "#/components/schemas/Category"
        tags:
          type: array
          items:
            type: string
        start_at:
          type: string
          format: date-time
        expire_at:
          type: string
          format: date-time
        votes_per_user:
          type: integer
        votes_per_option:
          type: integer
      required:
        - public
        - title
        - category
        - start_at
        - votes_per_user
        - votes_per_option

    Poll:
      allOf:
        - $ref: "#/components/schemas/PollBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            options:
              type: array
              items:
                $ref: "#/components/schemas/PollOption"
            participants_count:
              type: integer
              description: "参与投票的用户数"
            total_votes_count:
              type: integer
              description: "总投票数"
            likes_count:
              type: integer
            my_votes:
              type: array
              description: "当前用户已投票的选项及票数"
              items:
                $ref: "#/components/schemas/PollVote"
            like_status:
              $ref: "#/components/schemas/LikeStatus"
          required:
            - id
            - options
            - participants_count
            - total_votes_count
            - likes_count
            - my_votes
            - like_status

    CreatePollRequest:
      allOf:
        - $ref: "#/components/schemas/PollBase"
        - type: object
          properties:
            password:
              type: string
              description: "投票密码"
            options:
              type: array
              items:
                $ref: "#/components/schemas/PollOptionBase"
          required:
            - options

    OptionType:
      type: string
      enum:
        - text
        - image
        - music

    PollOptionBase:
      type: object
      properties:
        option_type:
          $ref: "#/components/schemas/OptionType"
        text:
          description: 选项文本
          $ref: "#/components/schemas/LocalizedText"
        description:
          description: 选项描述
          $ref: "#/components/schemas/LocalizedText"
        media_url:
          type: string
          format: uri
      required:
        - option_type
        - text

    PollOption:
      allOf:
        - $ref: "#/components/schemas/PollOptionBase"
        - type: object
          properties:
            id:
              type: string
              format: uuid
            votes_count:
              type: integer
              description: 获得的累计票数
          required:
            - id
            - type

    PollVote:
      type: object
      description: 投票时单个选项的投票信息
      properties:
        option_id:
          type: string
          format: uuid
          description: 选项ID
        votes:
          type: integer
          minimum: 0
          description: 给该选项投的票数
      required:
        - option_id
        - votes

    CommonError:
      type: object
      properties:
        error:
          type: string
          example: "Resource not found"
        message:
          type: string
          example: "The requested resource could not be found"
        code:
          type: integer
          example: 404
      required:
        - error
        - message
        - code

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommonError"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommonError"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommonError"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommonError"
